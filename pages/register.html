<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | UsList</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Boxicons -->
    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >

    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/auth.css">

</head>


<body class="auth-page">


    <main class="auth-container">

        <section class="auth-card">


            <!-- BRAND -->

            <a
                href="../index.html"
                class="auth-brand"
            >

                <span class="auth-brand-icon">
                    <i class="bx bx-heart"></i>
                </span>

                <span class="auth-brand-name">
                    UsList
                </span>

            </a>


            <!-- HEADER -->

            <div class="auth-header">

                <span class="auth-eyebrow">
                    OUR STORY STARTS HERE
                </span>

                <h1>
                    Create your account
                </h1>

                <p>
                    Create your private space for the
                    adventures and memories you share.
                </p>

            </div>


            <!-- ERROR -->

            <div
                class="auth-message error"
                id="authError"
                hidden
            ></div>


            <!-- FORM -->

            <form id="registerForm">


                <div class="form-group">

                    <label for="registerUsername">
                        Username
                    </label>

                    <div class="auth-input">

                        <i class="bx bx-user"></i>

                        <input
                            type="text"
                            id="registerUsername"
                            placeholder="Choose a username"
                            autocomplete="username"
                            minlength="3"
                            maxlength="20"
                            required
                        >

                    </div>

                    <small>
                        3–20 characters. Letters, numbers and underscores only.
                    </small>

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <div class="auth-input">

                        <i class="bx bx-lock-alt"></i>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="registerPassword"
                            aria-label="Show password"
                        >
                            <i class="bx bx-show"></i>
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label for="registerConfirmPassword">
                        Confirm password
                    </label>

                    <div class="auth-input">

                        <i class="bx bx-lock"></i>

                        <input
                            type="password"
                            id="registerConfirmPassword"
                            placeholder="Enter your password again"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="registerConfirmPassword"
                            aria-label="Show password"
                        >
                            <i class="bx bx-show"></i>
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="auth-submit"
                    id="registerButton"
                >

                    <span>
                        Create Account
                    </span>

                    <i class="bx bx-right-arrow-alt"></i>

                </button>

            </form>


            <!-- LOGIN -->

            <div class="auth-footer">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Log in
                </a>

            </div>


        </section>


        <!-- DECORATION -->

        <div class="auth-decoration">

            <div class="auth-ring ring-one"></div>

            <div class="auth-ring ring-two"></div>

            <i class="bx bx-heart"></i>

        </div>

    </main>


    <!-- Firebase -->

    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/notifications.js"></script>

</body>

</html>
