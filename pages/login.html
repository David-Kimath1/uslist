<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | His 'n' Hers</title>


    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Boxicons -->

    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >


    <!-- Styles -->

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/auth.css">

</head>


<body class="auth-page">


    <main class="auth-container">


        <section class="auth-card">


            <!-- BRAND -->

            <a
                href="../index.html"
                class="auth-brand"
            >

                <span class="auth-brand-icon">
                    <i class="bx bx-heart"></i>
                </span>

                <span class="auth-brand-name">
                    His 'n' Hers
                </span>

            </a>


            <!-- HEADER -->

            <div class="auth-header">

                <span class="auth-eyebrow">
                    WELCOME BACK
                </span>

                <h1>
                    Welcome back
                </h1>

                <p>
                    Log in and continue building
                    your story together.
                </p>

            </div>


            <!-- ERROR -->

            <div
                class="auth-message error"
                id="authError"
                hidden
            ></div>


            <!-- FORM -->

            <form id="loginForm">


                <div class="form-group">

                    <label for="loginUsername">
                        Username
                    </label>

                    <div class="auth-input">

                        <!-- <i class="bx bx-user"></i> -->

                        <input
                            type="text"
                            id="loginUsername"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="auth-input">

                        <i class="bx bx-lock-alt"></i>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="loginPassword"
                            aria-label="Show password"
                        >
                            <i class="bx bx-show"></i>
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="auth-submit"
                    id="loginButton"
                >

                    <span>
                        Log In
                    </span>

                    <i class="bx bx-right-arrow-alt"></i>

                </button>

            </form>


            <!-- REGISTER -->

            <div class="auth-footer">

                <span>
                    Don't have an account?
                </span>

                <a href="register.html">
                    Create one
                </a>

            </div>


        </section>


        <!-- DECORATION -->

        <div class="auth-decoration">

            <div class="auth-ring ring-one"></div>

            <div class="auth-ring ring-two"></div>

            <i class="bx bx-heart"></i>

        </div>


    </main>


    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/app-loaders.js"></script>
    <script type="module" src="../js/notifications.js"></script>

    
</body>

</html>
